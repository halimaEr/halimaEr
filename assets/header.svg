<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <style>
      .name { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 62px; font-weight: 800; letter-spacing: 1px; fill: url(#name); animation: fade 1.2s ease-out both; }
      .role { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 600; fill: #E2E8F0; letter-spacing: 3px; animation: fade 1.6s ease-out both; }
      .stack { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 16px; fill: #94A3B8; letter-spacing: 2px; animation: fade 2s ease-out both; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>
  <rect width="900" height="260" rx="22" fill="url(#bg)"/>
  <circle cx="60" cy="40" r="90" fill="#6366F1" opacity="0.10"/>
  <circle cx="850" cy="230" r="110" fill="#8B5CF6" opacity="0.12"/>
  <text x="450" y="115" text-anchor="middle" class="name">Halima Er-Reguigue</text>
  <rect x="250" y="135" width="400" height="3" rx="1.5" fill="url(#line)"/>
  <text x="450" y="178" text-anchor="middle" class="role">INGÉNIEURE EN GÉNIE INFORMATIQUE</text>
  <text x="450" y="212" text-anchor="middle" class="stack">Full-Stack  ·  Java  ·  Spring Boot  ·  Angular  ·  React</text>
</svg>
